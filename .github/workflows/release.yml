name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - "**"

# Read-only by default; only the release job gets write access.
permissions:
  contents: read

jobs:
  tests:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.27.4"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      # The tool catalog is not needed here: tests use their own fixtures and
      # the catalog package compiles without a generated catalog.
      - name: Run tests
        run: make test+coverage

      - if: ${{ matrix.go == '1.27.4' }}
        uses: shogo82148/actions-goveralls@v1
        with:
          path-to-profile: coverage.txt

  spellcheck:
    name: Spellcheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache: false

      - name: Run spellcheck
        run: |
          go install github.com/client9/misspell/cmd/misspell@latest
          misspell -error -locale US README.md services.yaml main.go cmd internal scripts

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache: false

      - name: Run lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --timeout 5m

  govulncheck:
    name: Check vulnerabilities
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"

      - name: Check vulnerabilities
        uses: golang/govulncheck-action@v1

  build:
    name: Build and release
    runs-on: ubuntu-latest

    # This job can ONLY run for a v* tag push.
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}

    needs:
      - tests
      - spellcheck
      - lint
      - govulncheck

    permissions:
      contents: write # create the GitHub release
      packages: write # push ghcr.io/moovit-sp-gmbh/hcloud-mcp

    env:
      # Optional: bearer token for the spec endpoints, if they are protected.
      SPEC_TOKEN: ${{ secrets.SPEC_TOKEN }}

    steps:
      # The OpenAPI specs (and thus the generated tools) come from the
      # environment matching the tag:
      #   v1.2.3-dev-1  -> dev
      #   v1.2.3        -> production
      # scripts/generate-catalog.sh (goreleaser before hook) fetches
      # <HCLOUD_API_SERVER>/api/<service>/v1/docs/spec.yaml
      - name: Select API server for this tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            *-dev-*) server="https://eu-dev-1.app.helmut.cloud" ;;
            *)       server="https://eu-central-1.app.helmut.cloud" ;;
          esac
          echo "HCLOUD_API_SERVER=$server" >> "$GITHUB_ENV"
          echo "Tag $TAG: generating tools from $server"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No QEMU needed: the image has no RUN steps, goreleaser only copies the
      # prebuilt linux/amd64 and linux/arm64 binaries into it.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set GoReleaser previous tag (to non -dev-)
        if: ${{ !contains(github.ref_name, '-dev-') }}
        run: |
          PREVIOUS_TAG=$(git tag --sort=-v:refname \
            | grep -v -- '-dev-' \
            | grep -v -- "^${GITHUB_REF_NAME}$" \
            | head -n 1)

          echo "GORELEASER_PREVIOUS_TAG=$PREVIOUS_TAG" >> "$GITHUB_ENV"
          echo "Previous stable tag: $PREVIOUS_TAG"

      # Regenerates the catalog, builds binaries, archives, .mcpb bundles and
      # the docker image, then creates a release with everything attached.
      # -dev- tags become a draft release, all other tags are published directly.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean ${{ contains(github.ref_name, '-dev-') && '--draft' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload tool catalog
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: tool-catalog
          path: internal/catalog/generated/catalog.json
          if-no-files-found: ignore
